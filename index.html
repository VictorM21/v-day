<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine? 💕</title>
    <meta name="description" content="A little Valentine's question, just for you. 💕">
    <meta name="theme-color" content="#FFD9E6">
    <meta property="og:title" content="Will you be my Valentine? 💕">
    <meta property="og:description" content="A little Valentine's question, just for you.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%95%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-bg" aria-hidden="true"></div>

    <main class="container">
        <h1 id="valentine-question">Will you be my Valentine, <span id="her-name">Isimi Mi</span>? 💕</h1>

        <div class="gif-container">
            <img id="cat-gif" src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="A cute character looking at you hopefully" width="200" height="200">
            <span id="gif-fallback" class="gif-fallback" role="img" aria-label="A cute reaction" hidden>🥰</span>
        </div>

        <div class="buttons">
            <button type="button" id="yes-btn">Yes</button>
            <button type="button" id="no-btn">No</button>
        </div>
        <div id="tease-toast" role="status" aria-live="polite"></div>
    </main>

    <noscript>
        <p class="noscript">This page needs JavaScript to work its magic. Please turn it on 💕</p>
    </noscript>

    <audio id="bg-music" preload="auto"></audio>
    <button type="button" id="music-toggle" aria-label="Pause music" aria-pressed="false" title="Pause music">🔊</button>

    <!-- Only shown on touch screens when the browser blocked autoplay -->
    <p id="mobile-tap-prompt" class="tap-prompt">✨ Tap anywhere for a surprise! ✨</p>

    <script src="config.js" defer></script>
    <script src="common.js" defer></script>
    <script src="music.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
